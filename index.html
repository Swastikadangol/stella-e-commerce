<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Stella Jewellers</title>
    <link rel="stylesheet" href="home.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #E3E6F3 0%, #f8f9fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .logo-container h1 {
            color: #088178;
            font-size: 35px;
            margin-top: 10px;
        }
        
        .logo-container p {
            color: #465b52;
            font-size: 20px;
        }
        
        .back-link {
            display: inline-block;
            color: #088178;
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 20px;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #f06059;
        }
        
        .form-container {
            background: white;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        
        .form-title {
            color: #f06059;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }
        
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .input-group {
            margin-bottom: 15px;
            flex: 1;
        }
        
        .input-group label {
            display: block;
            color: #333;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 20px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #088178;
            box-shadow: 0 0 0 3px rgba(8, 129, 120, 0.1);
        }
        
        .password-container {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 20px;
        }
        
      
        
     
        
      
        
      
        
        .valid {
            color: #088178;
        }
        
        .invalid {
            color: #f06059;
        }
        
        .terms {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .terms input[type="checkbox"] {
            accent-color: #088178;
            margin-top: 4px;
            margin-right: 10px;
        }
        
        .terms a {
            color: #088178;
            text-decoration: none;
        }
        
        .terms a:hover {
            text-decoration: underline;
        }
        
        .btn-register {
            background: #f06059;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        
        .btn-register:hover {
            background: #e0554e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 96, 89, 0.3);
        }
        
        .login-link {
            text-align: center;
            color: #465b52;
            font-size: 20px;
        }
        
        .login-link a {
            color: #088178;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #f06059;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        .btn-register {
    display: inline-block;
    text-align: center;
    text-decoration: none;
    background: #f06059;
    color: white;
    border: none;
    padding: 14px;
    width: 100%;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 15px;
}

.btn-register:hover {
    background: #e0554e;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(240, 96, 89, 0.3);
    color: white;
    text-decoration: none;
}
        
        @media (max-width: 480px) {
            .input-row {
                flex-direction: column;
                gap: 0;
            }
            
            .form-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
       
        
        <div class="logo-container">
            <h1>Stella Jewellers</h1>
            <p>Create your account</p>
        </div>
        
        <div class="form-container">
            <h2 class="form-title">Join Us Today</h2>
            
            <form id="registerForm">
                <div class="input-row">
                    <div class="input-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="John" required>
                        <div class="error-message" id="firstNameError">First name is required</div>
                    </div>
                    
                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Doe" required>
                        <div class="error-message" id="lastNameError">Last name is required</div>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                    <div class="error-message" id="emailError">Please enter a valid email</div>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Create a password" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            👁️
                        </button>
                    </div>
                    
                </div>
                
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                        <button type="button" class="toggle-password" id="toggleConfirmPassword">
                            👁️
                        </button>
                    </div>
                    <div class="error-message" id="confirmPasswordError">Passwords do not match</div>
                </div>
                
              
                
                <div class="terms">
                    <input type="checkbox" id="acceptTerms" required>
                    <label for="acceptTerms">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>
                
              <a href="login.html" class="btn-register">Create Account</a>
                
                <div class="login-link">
                    Already have an account? 
                    <a href="login.html">Sign in here</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Toggle password visibility
        const toggleButtons = document.querySelectorAll('.toggle-password');
        toggleButtons.forEach(button => {
            button.addEventListener('click', function() {
                const inputId = this.id === 'togglePassword' ? 'password' : 'confirmPassword';
                const passwordInput = document.getElementById(inputId);
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
            });
        });

        // Password strength checker
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const requirements = {
            length: document.getElementById('reqLength'),
            uppercase: document.getElementById('reqUppercase'),
            lowercase: document.getElementById('reqLowercase'),
            number: document.getElementById('reqNumber')
        };

       
        // Confirm password validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const errorElement = document.getElementById('confirmPasswordError');
            
            if (confirmPassword && password !== confirmPassword) {
                errorElement.style.display = 'block';
            } else {
                errorElement.style.display = 'none';
            }
        });

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const acceptTerms = document.getElementById('acceptTerms').checked;
            
            let isValid = true;
            
            // Validate fields
            const fields = ['firstName', 'lastName', 'email', 'password'];
            fields.forEach(field => {
                const errorElement = document.getElementById(field + 'Error');
                const value = document.getElementById(field).value;
                
                if (!value) {
                    errorElement.style.display = 'block';
                    isValid = false;
                } else {
                    errorElement.style.display = 'none';
                }
            });
            
            // Validate email format
            const emailError = document.getElementById('emailError');
            if (email && (!email.includes('@') || !email.includes('.'))) {
                emailError.style.display = 'block';
                isValid = false;
            }
            
            // Check if passwords match
            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').style.display = 'block';
                isValid = false;
            }
            
            // Check terms acceptance
            if (!acceptTerms) {
                alert('Please accept the Terms of Service and Privacy Policy');
                isValid = false;
            }
            
            if (isValid) {
                // Check if user already exists
                const users = JSON.parse(localStorage.getItem('stella_users') || '[]');
                const userExists = users.some(u => u.email === email);
                
                if (userExists) {
                    alert('An account with this email already exists. Please log in instead.');
                    return;
                }
                
                // Create new user object
                const newUser = {
                    id: Date.now(),
                    firstName,
                    lastName,
                    email,
                    password,
                    createdAt: new Date().toISOString()
                };
                
                // Save to localStorage
                users.push(newUser);
                localStorage.setItem('stella_users', JSON.stringify(users));
                
                // Store as current user
                localStorage.setItem('current_user', JSON.stringify(newUser));
                
                // Success message and redirect
                alert('Account created successfully! Welcome to Stella Jewellers.');
                window.location.href = 'index.html';
            }
        });

        // Add Font Awesome for icons
        const faScript = document.createElement('script');
        faScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js';
        document.head.appendChild(faScript);
    </script>
</body>
</html>
